; ============================================================================
; JARVIS STANDALONE - ESP32-S3 DevKitC-1 + Gemini Live API
; Sin servidor: el ESP32 es el cerebro (Gemini Live) y el cuerpo (pantalla,
; enchufe Tuya, sensor) al mismo tiempo.
; ============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

; La placa fue verificada con esptool: incorpora 8 MB de PSRAM OPI.
; qio_opi + BOARD_HAS_PSRAM son necesarios para habilitarla correctamente.
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D WEBSOCKETS_LOGLEVEL=4
    -D BOARD_HAS_PSRAM

lib_deps =
    ; ArduinoWebsockets está vendorizada en lib/ con los arreglos ESP32 TLS
    ; y de lectura de frames grandes requeridos por Gemini Live.
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
