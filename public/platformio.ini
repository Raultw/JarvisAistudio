; ============================================================================
; Proyecto Jarvis - ESP32-S3 DevKitC-1 Configuration
; Visual Studio Code + PlatformIO
; ============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Velocidad del monitor serie en baudios
monitor_speed = 115200

; Optimización de memoria y configuración de Flash
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Librerías oficiales requeridas (PlatformIO las descarga automáticamente)
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Flag para ampliar el buffer de paquetes MQTT a 512 bytes
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
    -D CORE_DEBUG_LEVEL=0
